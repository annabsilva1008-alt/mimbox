<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gerenciar Site | Mimbox ADM</title>

<style>
:root {
  --yellow: #F8D43A;
  --red: #E74732;
  --blue: #2355AC;
  --cream: #F5EBD5;
  --ink: #211B1B;
  --white: #FFFDF8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Arial, sans-serif;
}
header {
  background: var(--ink);
  color: white;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  font-size: 30px;
  font-weight: 900;
  color: var(--yellow);
}
header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}
main {
  max-width: 1150px;
  margin: 30px auto;
  padding: 0 18px 60px;
}
h1 { margin-bottom: 8px; }
.intro {
  color: #595148;
  line-height: 1.5;
}
#status {
  padding: 14px;
  background: white;
  border-left: 5px solid var(--blue);
  border-radius: 5px;
  margin: 20px 0;
  white-space: pre-wrap;
}
#status.error { border-color: var(--red); }
#status.success { border-color: #27824C; }
[hidden] { display: none !important; }
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
}
.tab {
  background: white;
  border: 2px solid var(--ink);
  padding: 12px 16px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}
.tab.active {
  background: var(--blue);
  color: white;
}
.page-title {
  background: var(--yellow);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
.page-title h2 { margin: 0 0 6px; }
.page-title p { margin: 0; }
.panel {
  background: var(--white);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 4px 4px 0 var(--ink);
}
.panel h3 { margin-top: 0; }
.field { margin-bottom: 20px; }
label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}
input, textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid #C3BAAD;
  border-radius: 8px;
  background: white;
  font: inherit;
}
textarea {
  min-height: 110px;
  resize: vertical;
}
.image-field {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 18px;
  padding: 15px;
  border: 2px dashed #C8C0B5;
  border-radius: 10px;
  background: #FAF7EF;
}
.image-preview {
  width: 180px;
  height: 160px;
  object-fit: contain;
  border-radius: 8px;
  background: #EAE5DB;
}
.image-placeholder {
  width: 180px;
  height: 160px;
  background: #EAE5DB;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: #746A60;
  text-align: center;
  padding: 12px;
}
.help {
  font-size: 13px;
  color: #655B51;
  line-height: 1.5;
}
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px;
}
button.action {
  border: 2px solid var(--ink);
  background: var(--yellow);
  padding: 14px 20px;
  border-radius: 9px;
  font-weight: 800;
  cursor: pointer;
}
button.secondary { background: white; }
button:disabled {
  opacity: .55;
  cursor: wait;
}
@media(max-width:650px) {
  .image-field { grid-template-columns: 1fr; }
  .tab { flex: 1 1 140px; }
}

/* Recorte e envio de imagens */
.crop-modal {position:fixed;inset:0;z-index:1000;background:#000b;display:grid;place-items:center;padding:16px;overflow:auto}
.crop-box {background:var(--cream);border:3px solid var(--ink);border-radius:15px;padding:20px;width:min(760px,100%);max-height:95vh;overflow:auto}
.crop-stage {background:#333;border-radius:9px;padding:12px;display:grid;place-items:center;margin:15px 0}
#crop-canvas {max-width:100%;max-height:48vh;touch-action:none;cursor:grab}
.crop-options {display:grid;grid-template-columns:1fr 1fr;gap:15px}
.crop-options input,.crop-options select {width:100%}
.upload-state {font-size:13px;font-weight:700;margin-top:8px}
body.modal-open {overflow:hidden}
@media(max-width:650px){.crop-options{grid-template-columns:1fr}}
</style>
<script src="/assets/upload-image.js?v=4"></script></head>

<body>
<header>
  <div class="brand">mimbox.</div>
  <a href="/admin.html">← Voltar ao ADM</a>
</header>

<main>
  <h1>Gerenciar Site</h1>
  <p class="intro">
    Escolha a página e edite suas imagens, textos e botões.
    As alterações são salvas no Supabase.
  </p>

  <div id="status" role="status" aria-live="polite">
    Verificando acesso...
  </div>

  <div id="editor" hidden>
    <nav class="tabs" id="tabs"></nav>

    <div class="page-title" id="page-title"></div>

    <form id="site-form">
      <div id="fields"></div>

      <div class="actions">
        <button class="action" id="save" type="submit">
          Salvar alterações
        </button>
        <button class="action secondary" id="reload" type="button">
          Recarregar
        </button>
      </div>
    </form>
  </div>
</main>


<div id="crop-modal" class="crop-modal" role="dialog" aria-modal="true" aria-labelledby="crop-title" hidden>
 <div class="crop-box">
  <h2 id="crop-title">Ajustar imagem</h2>
  <p>Arraste a imagem para ajustar o enquadramento. Use o zoom para aproximar.</p>
  <div class="crop-stage"><canvas id="crop-canvas" width="600" height="338"></canvas></div>
  <div class="crop-options">
   <div><label for="crop-ratio">Formato</label><select id="crop-ratio"><option value="16:9">Banner horizontal (16:9)</option><option value="4:3">Horizontal (4:3)</option><option value="1:1">Quadrado (1:1)</option><option value="4:5">Vertical (4:5)</option><option value="9:16">Story (9:16)</option></select></div>
   <div><label for="crop-zoom">Zoom: <span id="zoom-value">100%</span></label><input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"></div>
  </div>
  <div class="actions"><button type="button" class="action secondary" id="crop-reset">Centralizar foto</button><button type="button" class="action" id="crop-confirm">Confirmar recorte e enviar</button><button type="button" class="action secondary" id="crop-cancel">Cancelar</button></div>
  <p id="crop-status" role="status" aria-live="polite"></p>
 </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

/*
  Tipos de campos:
  text  = texto curto
  long  = texto longo
  image = endereço de imagem HTTPS
*/

const PAGES = [
  {
    id: "inicio",
    name: "Início",
    description: "Banner e imagens da página inicial.",
    sections: [
      {
        name: "Banner principal",
        fields: [
          ["hero_titulo", "Título principal", "text"],
          ["hero_subtitulo", "Subtítulo", "long"],
          ["hero_imagem", "Imagem principal", "image"],

        ]
      },
      {
        name: "Cards da página inicial",
        fields: [
          ["inicio_personalizados_imagem", "Card Personalizados", "image"],
          ["inicio_loja_imagem", "Card Loja Mimbox", "image"],
          ["inicio_negocios_imagem", "Card Para Negócios", "image"]
        ]
      },
      {
        name: "Contato e SEO",
        fields: [
          ["seo_titulo", "Título SEO", "text"],
          ["seo_descricao", "Descrição SEO", "long"],
          ["whatsapp", "WhatsApp com DDI e DDD", "text"],
          ["instagram", "Link do Instagram", "text"],
          ["aviso", "Aviso da loja", "long"]
        ]
      }
    ]
  },
  {
    id: "personalizados",

    description: "Imagens e textos da página de personalizados.",
    sections: [
      {
        name: "Banner de Personalizados",
        fields: [
          ["personalizados_titulo", "Título", "text"],
          ["personalizados_subtitulo", "Descrição", "long"],
          ["personalizados_banner_imagem", "Imagem principal", "image"]
        ]
      },
      {
        name: "Categorias",
        fields: [
          ["personalizados_copos_imagem", "Foto dos copos", "image"],
          ["personalizados_pratos_imagem", "Foto dos pratos", "image"],
          ["personalizados_brindes_imagem", "Foto dos brindes", "image"]
        ]
      }
    ]
  },
  {
    id: "loja",
    name: "Loja Mimbox",
    description: "Banner e imagens editoriais da loja.",
    sections: [
      {
        name: "Banner da Loja",
        fields: [
          ["loja_titulo", "Título", "text"],
          ["loja_subtitulo", "Descrição", "long"],
          ["loja_banner_imagem", "Imagem principal", "image"],
          ["loja_botao_texto", "Texto do botão", "text"],
          ["loja_botao_link", "Link do botão", "text"]
        ]
      },
      {
        name: "Destaques",
        fields: [
          ["loja_colecoes_imagem", "Imagem das coleções", "image"],
          ["loja_destaque_imagem", "Imagem de destaque", "image"]
        ]
      }
    ]
  },
  {
    id: "negocios",
    name: "Para Negócios",
    description: "Conteúdo da página corporativa.",
    sections: [
      {
        name: "Banner Corporativo",
        fields: [
          ["negocios_titulo", "Título", "text"],
          ["negocios_subtitulo", "Descrição", "long"],
          ["negocios_banner_imagem", "Imagem principal", "image"]
        ]
      },
      {
        name: "Serviços",
        fields: [
          ["negocios_brindes_imagem", "Foto dos brindes", "image"],
          ["negocios_personalizados_imagem", "Foto dos personalizados", "image"],
          ["negocios_botao_texto", "Texto do botão", "text"],
          ["negocios_botao_link", "Link do botão", "text"]
        ]
      }
    ]
  },
  {
    id: "sobre",
    name: "Sobre",
    description: "História e fotografias da Mimbox.",
    sections: [
      {
        name: "Nossa História",
        fields: [
          ["sobre_titulo", "Título", "text"],
          ["sobre_texto", "História da Mimbox", "long"],
          ["sobre_banner_imagem", "Imagem principal", "image"]
        ]
      },
      {
        name: "Fundadoras",
        fields: [
          ["sobre_ana_imagem", "Foto da Ana", "image"],
          ["sobre_rafa_imagem", "Foto da Rafa", "image"]
        ]
      }
    ]
  },
  {
    id: "blog",
    name: "Blog",
    description: "Apresentação do Blog Mimbox.",
    sections: [
      {
        name: "Banner do Blog",
        fields: [
          ["blog_titulo", "Título", "text"],
          ["blog_subtitulo", "Descrição", "long"],
          ["blog_banner_imagem", "Imagem principal", "image"]
        ]
      }
    ]
  }
];

let content = {};
let lastSaved = "";
let activePage = "inicio";
let busy = false;
let uploading = false;

function message(text, type = "") {
  $("status").textContent = text;
  $("status").className = type;
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    cache: "no-store",
    ...options
  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw Error("Resposta inválida do servidor.");
  }

  if (!response.ok) {
    throw Error(
      data.erro ||
      data.error ||
      "Erro HTTP " + response.status
    );
  }

  return data;
}

function allKeys() {
  const keys = new Set();

  for (const page of PAGES) {
    for (const section of page.sections) {
      for (const [key] of section.fields) {
        keys.add(key);
      }
    }
  }

  return [...keys];
}

function snapshot() {
  const result = {};

  for (const key of allKeys()) {
    result[key] = String(content[key] ?? "").trim();
  }

  return result;
}

function rememberInputs() {
  document.querySelectorAll("[data-field]").forEach(input => {
    content[input.dataset.field] = input.value;
  });
}

function makeTextField(key, label, type) {
  const wrapper = document.createElement("div");
  wrapper.className = "field";

  const fieldLabel = document.createElement("label");
  fieldLabel.textContent = label;
  fieldLabel.htmlFor = "field-" + key;

  const input = type === "long"
    ? document.createElement("textarea")
    : document.createElement("input");

  if (type !== "long") {
    input.type = "text";
  }

  input.id = "field-" + key;
  input.dataset.field = key;
  input.value = content[key] || "";

  input.addEventListener("input", () => {
    content[key] = input.value;
  });

  wrapper.append(fieldLabel, input);
  return wrapper;
}

function makeImageField(key, label) {
  const wrapper = document.createElement("div");
  wrapper.className = "field image-field";
  const visual = document.createElement("div");
  const image = document.createElement("img");
  image.className = "image-preview";
  image.alt = "Prévia de " + label;
  const placeholder = document.createElement("div");
  placeholder.className = "image-placeholder";
  placeholder.textContent = "Sem imagem cadastrada";
  const controls = document.createElement("div");
  const heading = document.createElement("label");
  heading.textContent = label;
  heading.htmlFor = "field-" + key;
  const urlInput = document.createElement("input");
  urlInput.type = "url";
  urlInput.id = "field-" + key;
  urlInput.placeholder = "https://...";
  urlInput.dataset.field = key;
  urlInput.value = content[key] || "";
  const uploadLabel = document.createElement("label");
  uploadLabel.textContent = "Escolher foto do computador";
  const uploadInput = document.createElement("input");
  uploadInput.type = "file";
  uploadInput.accept = "image/jpeg,image/png,image/webp";
  uploadInput.style.margin = "10px 0";
  const uploadState = document.createElement("p");
  uploadState.className = "upload-state";
  uploadState.setAttribute("aria-live", "polite");
  const help = document.createElement("p");
  help.className = "help";
  help.textContent = "Escolha a foto no computador e ajuste o recorte. O painel reduz o peso automaticamente antes do envio, preservando a nitidez. Depois clique em Salvar alterações.";
  function preview(url) {
    if (/^https:\/\/\S+$/i.test(url)) {
      image.src = url;
      image.hidden = false;
      placeholder.hidden = true;
    } else {
      image.hidden = true;
      image.removeAttribute("src");
      placeholder.hidden = false;
    }
  }
  image.onerror = () => {image.hidden = true; placeholder.hidden = false; placeholder.textContent = "Não foi possível carregar a foto.";};
  urlInput.addEventListener("input", () => {content[key] = urlInput.value; preview(urlInput.value.trim());});
  uploadInput.addEventListener("change", async () => {
    const file = uploadInput.files?.[0];
    if (!file) return;
    try {await openCropEditor(file, {key,label,urlInput,uploadInput,uploadState,preview});}
    catch (error) {uploadState.textContent = "Erro: " + error.message;message(error.message,"error");uploadInput.value="";}
  });
  preview(urlInput.value.trim());
  visual.append(image,placeholder);
  controls.append(heading,urlInput,uploadLabel,uploadInput,uploadState,help);
  wrapper.append(visual,controls);
  return wrapper;
}

// Editor de recorte com upload pelo endpoint já existente.
const cropCanvas = $("crop-canvas");
const cropCtx = cropCanvas.getContext("2d");
let cropImage = null, cropTarget = null, cropZoom = 1, cropX = 0, cropY = 0;
let dragging = false, pointerX = 0, pointerY = 0;
function defaultRatio(key) {
  if (key.includes("banner") || key === "hero_imagem") return "16:9";
  if (key === "sobre_ana_imagem" || key === "sobre_rafa_imagem") return "4:5";
  return "1:1";
}
async function openCropEditor(file,target) {
  if (!["image/jpeg","image/png","image/webp"].includes(file.type)) throw Error("Use JPG, PNG ou WebP.");
  if (file.size > 20*1024*1024) throw Error("A imagem deve ter até 20 MB.");
  if (!window.createImageBitmap) throw Error("Este navegador não suporta o recorte de imagens.");
  const bitmap = await createImageBitmap(file);
  if (cropImage) cropImage.close();
  cropImage = bitmap;
  cropTarget = target; cropTarget.originalBytes=file.size;
  cropZoom = 1; cropX = 0; cropY = 0;
  $("crop-title").textContent = "Ajustar imagem — " + target.label;
  $("crop-ratio").value = defaultRatio(target.key);
  $("crop-zoom").value = "1";
  $("zoom-value").textContent = "100%";
  $("crop-status").textContent = "";
  updateCropRatio();
  $("crop-modal").hidden = false;
  document.body.classList.add("modal-open");
}
function updateCropRatio() {
  const [w,h] = $("crop-ratio").value.split(":").map(Number);
  if (w >= h) {cropCanvas.width=600;cropCanvas.height=Math.round(600*h/w);}
  else {cropCanvas.height=600;cropCanvas.width=Math.round(600*w/h);}
  cropX=0;cropY=0;drawCrop();
}
function geometry() {
  const cw=cropCanvas.width,ch=cropCanvas.height;
  const scale=Math.max(cw/cropImage.width,ch/cropImage.height)*cropZoom;
  const dw=cropImage.width*scale,dh=cropImage.height*scale;
  const mx=Math.max(0,(dw-cw)/2),my=Math.max(0,(dh-ch)/2);
  cropX=Math.max(-mx,Math.min(mx,cropX));
  cropY=Math.max(-my,Math.min(my,cropY));
  return {x:(cw-dw)/2+cropX,y:(ch-dh)/2+cropY,dw,dh};
}
function drawCrop() {
  if (!cropImage) return;
  const g=geometry(),cw=cropCanvas.width,ch=cropCanvas.height;
  cropCtx.clearRect(0,0,cw,ch);
  cropCtx.drawImage(cropImage,g.x,g.y,g.dw,g.dh);
  cropCtx.save();cropCtx.strokeStyle="rgba(255,255,255,.6)";cropCtx.lineWidth=1;
  for(let i=1;i<3;i++){
    cropCtx.beginPath();cropCtx.moveTo(cw*i/3,0);cropCtx.lineTo(cw*i/3,ch);cropCtx.stroke();
    cropCtx.beginPath();cropCtx.moveTo(0,ch*i/3);cropCtx.lineTo(cw,ch*i/3);cropCtx.stroke();
  }
  cropCtx.restore();
}
$("crop-ratio").addEventListener("change",updateCropRatio);
$("crop-zoom").addEventListener("input",()=>{cropZoom=Number($("crop-zoom").value);$("zoom-value").textContent=Math.round(cropZoom*100)+"%";drawCrop();});
$("crop-reset").addEventListener("click",()=>{cropZoom=1;cropX=0;cropY=0;$("crop-zoom").value="1";$("zoom-value").textContent="100%";drawCrop();});
cropCanvas.addEventListener("pointerdown",e=>{if(!cropImage)return;dragging=true;pointerX=e.clientX;pointerY=e.clientY;cropCanvas.setPointerCapture(e.pointerId);});
cropCanvas.addEventListener("pointermove",e=>{if(!dragging||!cropImage)return;const rect=cropCanvas.getBoundingClientRect();cropX+=(e.clientX-pointerX)*cropCanvas.width/rect.width;cropY+=(e.clientY-pointerY)*cropCanvas.height/rect.height;pointerX=e.clientX;pointerY=e.clientY;drawCrop();});
for(const name of ["pointerup","pointercancel","lostpointercapture"])cropCanvas.addEventListener(name,()=>{dragging=false;});
function closeCropEditor(){if(uploading)return;if(cropImage){cropImage.close();cropImage=null;}if(cropTarget?.uploadInput)cropTarget.uploadInput.value="";cropTarget=null;$("crop-modal").hidden=true;document.body.classList.remove("modal-open");}
$("crop-cancel").addEventListener("click",closeCropEditor);
async function cropToWebP(){
  if(!cropImage)throw Error('Nenhuma imagem selecionada.');
  const g=geometry(),cw=cropCanvas.width,ch=cropCanvas.height;
  const x=Math.max(0,-g.x*cropImage.width/g.dw),y=Math.max(0,-g.y*cropImage.height/g.dh);
  const width=Math.min(cropImage.width-x,cw*cropImage.width/g.dw),height=Math.min(cropImage.height-y,ch*cropImage.height/g.dh);
  return MimboxUpload.fromCrop(cropImage,{x,y,width,height},{originalBytes:cropTarget?.originalBytes||0});
}
$("crop-confirm").addEventListener("click",async()=>{
  if(!cropTarget||uploading||busy)return;
  const target=cropTarget;
  uploading=true;$("crop-confirm").disabled=true;$("crop-cancel").disabled=true;
  try{
    $("crop-status").textContent="Preparando imagem...";
    const prepared=await cropToWebP(); const imagem=await MimboxUpload.toBase64(prepared.blob);
    $("crop-status").textContent="Foto preparada: "+MimboxUpload.describe(prepared)+". Enviando...";
    const result=await api("/api/admin-operacoes",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({acao:"produto_imagem_upload",tipo:prepared.blob.type,imagem_base64:imagem})
    });
    if(!result.ok||!/^https:\/\/\S+$/i.test(result.imagem_url||""))throw Error("O servidor não confirmou o envio.");
    content[target.key]=result.imagem_url;
    target.urlInput.value=result.imagem_url;
    target.preview(result.imagem_url);
    target.uploadState.textContent="Foto enviada: "+MimboxUpload.describe(prepared)+". Clique em Salvar alterações.";
    message("Foto enviada. Clique em Salvar alterações para publicar.","success");
    uploading=false;closeCropEditor();
  }catch(error){
    $("crop-status").textContent="Erro no envio: "+error.message;
    target.uploadState.textContent="Erro: "+error.message;
    message("Erro no envio: "+error.message,"error");
  }finally{uploading=false;$("crop-confirm").disabled=false;$("crop-cancel").disabled=false;}
});

function renderTabs() {
  const tabs = $("tabs");
  tabs.replaceChildren();

  for (const page of PAGES) {
    const button = document.createElement("button");
    button.type = "button";
    button.className =
      "tab" + (page.id === activePage ? " active" : "");
    button.textContent = page.name;
    button.setAttribute("aria-pressed", String(page.id === activePage));

    button.addEventListener("click", () => {
      if (busy || uploading) return;
      rememberInputs();
      activePage = page.id;
      render();
    });

    tabs.append(button);
  }
}

function render() {
  renderTabs();

  const page = PAGES.find(
    item => item.id === activePage
  );

  const heading = $("page-title");
  heading.replaceChildren();

  const title = document.createElement("h2");
  title.textContent = page.name;

  const description = document.createElement("p");
  description.textContent = page.description;

  heading.append(title, description);

  const container = $("fields");
  container.replaceChildren();

  for (const section of page.sections) {
    const panel = document.createElement("section");
    panel.className = "panel";

    const sectionTitle = document.createElement("h3");
    sectionTitle.textContent = section.name;
    panel.append(sectionTitle);

    for (const [key, label, type] of section.fields) {
      panel.append(
        type === "image"
          ? makeImageField(key, label)
          : makeTextField(key, label, type)
      );
    }

    container.append(panel);
  }
}

function setBusy(value) {
  busy = value;
  $("save").disabled = value;
  $("reload").disabled = value;
}

async function load() {
  setBusy(true);
  message("Carregando informações do site...");

  try {
    const data = await api(
      "/api/admin-gerenciar?action=site_conteudo"
    );

    if (!data.ok || !data.conteudo) {
      throw Error("Conteúdo não encontrado.");
    }

    content = { ...data.conteudo };
    lastSaved = JSON.stringify(snapshot());

    render();
    $("editor").hidden = false;

    message("Dados carregados. Você já pode editar. Imagens devem ter uma URL HTTPS pública.");
  } catch (error) {
    message(
      "Erro ao carregar: " + error.message,
      "error"
    );
  } finally {
    setBusy(false);
  }
}

function validate(data) {
  if (
    data.whatsapp &&
    !/^\d{10,15}$/.test(data.whatsapp)
  ) {
    throw Error(
      "WhatsApp: informe de 10 a 15 números."
    );
  }

  if (
    data.instagram &&
    !/^https:\/\/\S+$/i.test(data.instagram)
  ) {
    throw Error(
      "Instagram: informe um endereço HTTPS."
    );
  }

  for (const [key, value] of Object.entries(data)) {
    if (
      key.endsWith("_imagem") &&
      value &&
      !/^https:\/\/\S+$/i.test(value)
    ) {
      throw Error(
        "Imagem inválida: " + key
      );
    }
  }
}

$("site-form").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  rememberInputs();

  const dataToSave = snapshot();

  try {
    validate(dataToSave);
  } catch (error) {
    message(error.message, "error");
    return;
  }

  setBusy(true);
  message("Salvando alterações no Supabase...");

  try {
    const result = await api("/api/admin-gerenciar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "site_conteudo",
        conteudo: dataToSave
      })
    });

    if (!result.ok) {
      throw Error(
        "O servidor não confirmou o salvamento."
      );
    }

    if (!result.conteudo || typeof result.conteudo !== "object") {
      throw Error("O servidor não devolveu o conteúdo salvo.");
    }

    content = { ...result.conteudo };
    lastSaved = JSON.stringify(snapshot());

    render();

    message(
      "Alterações salvas no Supabase. " +
      "As páginas públicas precisam estar integradas " +
      "para exibir os novos conteúdos.",
      "success"
    );
  } catch (error) {
    message(
      "Erro ao salvar: " + error.message,
      "error"
    );
  } finally {
    setBusy(false);
  }
});

$("reload").addEventListener("click", () => {
  rememberInputs();

  if (
    JSON.stringify(snapshot()) !== lastSaved &&
    !confirm("Descartar alterações não salvas?")
  ) {
    return;
  }

  load();
});

window.addEventListener("beforeunload", event => {
  rememberInputs();

  if (
    lastSaved &&
    JSON.stringify(snapshot()) !== lastSaved
  ) {
    event.preventDefault();
    event.returnValue = "";
  }
});

(async () => {
  try {
    const session = await api("/api/admin-session");

    if (session.autenticado !== true) {
      throw Error("Sessão não autorizada.");
    }

    await load();
  } catch (error) {
    message(
      "Acesso restrito. Entre no painel administrativo. " +
      error.message,
      "error"
    );
  }
})();
</script>
