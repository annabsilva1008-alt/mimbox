
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gerenciar Site | Mimbox ADM</title>

  <style>
    :root {
      --yellow: #F8D43A;
      --red: #E74732;
      --blue: #2355AC;
      --cream: #F5EBD5;
      --ink: #211B1B;
      --white: #FFFDF8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button { cursor: pointer; }

    header {
      background: var(--ink);
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      color: var(--yellow);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    header a {
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px 70px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 42px);
      margin: 0 0 10px;
    }

    h2, h3 { margin-top: 0; }

    p { line-height: 1.5; }

    .intro {
      color: #514940;
      margin-bottom: 24px;
    }

    .notice {
      padding: 14px;
      border-left: 5px solid var(--blue);
      background: white;
      border-radius: 5px;
      margin: 18px 0;
      white-space: pre-wrap;
    }

    .notice.error {
      border-left-color: var(--red);
    }

    .notice.success {
      border-left-color: #237447;
    }

    [hidden] { display: none !important; }

    .page-tabs {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin: 22px 0;
    }

    .page-tab {
      background: white;
      border: 2px solid var(--ink);
      border-radius: 9px;
      padding: 12px 16px;
      font-weight: 800;
    }

    .page-tab.active {
      background: var(--blue);
      color: white;
    }

    .panel {
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .section-description {
      color: #61594F;
      font-size: 14px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 2px solid #BDB5A8;
      border-radius: 8px;
      background: white;
      color: var(--ink);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: 3px solid #F8D43A88;
      border-color: var(--ink);
    }

    .image-editor {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      padding: 18px;
      border: 2px dashed #C6BFB1;
      border-radius: 12px;
      background: #FAF7EE;
      margin: 18px 0;
    }

    .image-preview {
      width: 100%;
      height: 160px;
      border: 1px solid #CFC7B8;
      border-radius: 9px;
      background: #ECE8DF;
      object-fit: contain;
    }

    .image-placeholder {
      height: 160px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #EAE4D8;
      color: #6B6258;
      text-align: center;
      font-size: 13px;
      padding: 12px;
    }

    .image-editor h3 {
      font-size: 17px;
      margin: 0 0 6px;
    }

    .muted {
      font-size: 13px;
      color: #665E54;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 22px 0;
    }

    .btn {
      border: 2px solid var(--ink);
      border-radius: 9px;
      padding: 13px 18px;
      background: var(--yellow);
      color: var(--ink);
      font-weight: 800;
    }

    .btn.secondary {
      background: white;
    }

    .btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 18px;
    }

    .page-heading {
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .page-heading h2 { margin-bottom: 6px; }

    @media (max-width: 720px) {
      .field-grid,
      .image-editor {
        grid-template-columns: 1fr;
      }

      .image-preview,
      .image-placeholder {
        max-width: 260px;
      }

      .panel { padding: 17px; }

      .page-tab {
        flex: 1 1 140px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">mimbox.</div>
    <a href="/admin.html">← Voltar ao ADM</a>
  </header>

  <main>
    <h1>Gerenciar Site</h1>

    <p class="intro">
      Escolha a página da Mimbox e edite cada seção.
      Todas as imagens ficam identificadas pelo local
      em que aparecem no site.
    </p>

    <div id="status" class="notice" role="status">
      Verificando acesso administrativo...
    </div>

    <div id="editor" hidden>

      <nav class="page-tabs" id="page-tabs"
           aria-label="Páginas do site"></nav>

      <div id="page-heading" class="page-heading"></div>

      <form id="site-form">
        <div id="page-fields"></div>

        <div class="actions">
          <button class="btn" id="save" type="submit">
            Salvar alterações
          </button>

          <button class="btn secondary" id="reload" type="button">
            Recarregar dados
          </button>
        </div>
      </form>

    </div>
  </main>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    /*
      Catálogo dos campos editáveis.

      Cada imagem tem:
      - página
      - seção
      - nome do elemento

      Os campos antigos da página inicial são
      preservados para compatibilidade.
    */

    const PAGES = [
      {
        id: "inicio",
        title: "Página Inicial",
        description: "Banner, coleções e imagens da Home.",
        sections: [
          {
            title: "01 · Banner principal",
            description: "Primeira seção da página inicial.",
            fields: [
              ["hero_titulo", "Título principal", "text"],
              ["hero_subtitulo", "Subtítulo", "textarea"],
              ["hero_imagem", "Imagem do banner principal", "image"],
              ["hero_botao_texto", "Texto do botão", "text"],
              ["hero_botao_link", "Link do botão", "text"]
            ]
          },
          {
            title: "02 · Destaques da Home",
            description: "Imagens dos três principais caminhos da loja.",
            fields: [
              ["inicio_personalizados_imagem", "Imagem do card Personalizados", "image"],
              ["inicio_loja_imagem", "Imagem do card Loja Mimbox", "image"],
              ["inicio_negocios_imagem", "Imagem do card Para Negócios", "image"]
            ]
          }
        ]
      },

      {
        id: "personalizados",
        title: "Personalizados",
        description: "Fotos, textos e chamadas dos produtos personalizados.",
        sections: [
          {
            title: "01 · Banner de Personalizados",
            fields: [
              ["personalizados_titulo", "Título principal", "text"],
              ["personalizados_subtitulo", "Descrição", "textarea"],
              ["personalizados_banner_imagem", "Imagem do banner", "image"]
            ]
          },
          {
            title: "02 · Categorias",
            fields: [
              ["personalizados_copos_imagem", "Imagem da categoria Copos", "image"],
              ["personalizados_pratos_imagem", "Imagem da categoria Pratos", "image"],
              ["personalizados_brindes_imagem", "Imagem da categoria Brindes", "image"]
            ]
          }
        ]
      },

      {
        id: "loja",
        title: "Loja Mimbox",
        description: "Banner e imagens editoriais da vitrine.",
        sections: [
          {
            title: "01 · Banner da Loja",
            fields: [
              ["loja_titulo", "Título principal", "text"],
              ["loja_subtitulo", "Descrição", "textarea"],
              ["loja_banner_imagem", "Imagem do banner da Loja", "image"],
              ["loja_botao_texto", "Texto do botão", "text"],
              ["loja_botao_link", "Link do botão", "text"]
            ]
          },
          {
            title: "02 · Imagens das Coleções",
            description: "As fotos individuais dos produtos continuam no catálogo do ADM.",
            fields: [
              ["loja_colecoes_imagem", "Imagem da seção Coleções", "image"],
              ["loja_destaque_imagem", "Imagem do destaque editorial", "image"]
            ]
          }
        ]
      },

      {
        id: "negocios",
        title: "Mimbox para Negócios",
        description: "Página de brindes e personalizados para empresas.",
        sections: [
          {
            title: "01 · Banner Corporativo",
            fields: [
              ["negocios_titulo", "Título principal", "text"],
              ["negocios_subtitulo", "Descrição", "textarea"],
              ["negocios_banner_imagem", "Imagem do banner", "image"]
            ]
          },
          {
            title: "02 · Apresentação dos Serviços",
            fields: [
              ["negocios_brindes_imagem", "Imagem dos brindes corporativos", "image"],
              ["negocios_personalizados_imagem", "Imagem dos produtos personalizados", "image"],
              ["negocios_botao_texto", "Texto do botão de orçamento", "text"],
              ["negocios_botao_link", "Link do botão de orçamento", "text"]
            ]
          }
        ]
      },

      {
        id: "sobre",
        title: "Sobre a Mimbox",
        description: "História da marca e fotos das fundadoras.",
        sections: [
          {
            title: "01 · Nossa História",
            fields: [
              ["sobre_titulo", "Título principal", "text"],
              ["sobre_texto", "Texto sobre a Mimbox", "textarea"],
              ["sobre_banner_imagem", "Imagem principal", "image"]
            ]
          },
          {
            title: "02 · Fundadoras",
            fields: [
              ["sobre_ana_imagem", "Foto da Ana", "image"],
              ["sobre_rafa_imagem", "Foto da Rafa", "image"]
            ]
          }
        ]
      },

      {
        id: "blog",
        title: "Blog",
        description: "Imagens e apresentação do Blog. Os artigos terão editor próprio.",
        sections: [
          {
            title: "01 · Apresentação do Blog",
            fields: [
              ["blog_titulo", "Título do Blog", "text"],
              ["blog_subtitulo", "Descrição do Blog", "textarea"],
              ["blog_banner_imagem", "Imagem principal do Blog", "image"]
            ]
          }
        ]
      }
    ];

    const GENERAL_FIELDS = [
      ["seo_titulo", "Título SEO", "text"],
      ["seo_descricao", "Descrição SEO", "textarea"],
      ["whatsapp", "WhatsApp", "text"],
      ["instagram", "Instagram", "text"],
      ["aviso", "Aviso da loja", "textarea"]
    ];

    const LEGACY_FIELDS = [
      "hero_titulo",
      "hero_subtitulo",
      "hero_imagem",
      "hero_botao_texto",
      "hero_botao_link",
      "seo_titulo",
      "seo_descricao",
      "whatsapp",
      "instagram",
      "aviso"
    ];

    let content = {};
    let lastSaved = "";
    let activePage = "inicio";
    let busy = false;

    function message(text, type = "") {
      $("status").textContent = text;
      $("status").className = "notice " + type;
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
        ...options
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw Error("Resposta inválida do servidor.");
      }

      if (!response.ok) {
        throw Error(
          data.erro ||
          data.error ||
          "Erro HTTP " + response.status
        );
      }

      return data;
    }

    function allFields() {
      const keys = new Set(LEGACY_FIELDS);

      for (const page of PAGES) {
        for (const section of page.sections) {
          for (const [key] of section.fields) {
            keys.add(key);
          }
        }
      }

      return [...keys];
    }

    function snapshot() {
      const result = {};

      for (const key of allFields()) {
        result[key] = String(content[key] ?? "").trim();
      }

      return result;
    }

    function rememberInputs() {
      document.querySelectorAll("[data-field]").forEach(input => {
        content[input.dataset.field] = input.value;
      });
    }

    function createField(key, label, type) {
      const wrapper = document.createElement("div");

      if (type === "image") {
        wrapper.className = "image-editor";

        const visual = document.createElement("div");
        const image = document.createElement("img");
        const placeholder = document.createElement("div");

        image.className = "image-preview";
        image.alt = "Prévia: " + label;

        placeholder.className = "image-placeholder";
        placeholder.textContent = "Nenhuma imagem cadastrada";

        const controls = document.createElement("div");

        const heading = document.createElement("h3");
        heading.textContent = label;

        const description = document.createElement("p");
        description.className = "muted";
        description.textContent =
          "Esta imagem pertence à página selecionada.";

        const urlLabel = document.createElement("label");
        urlLabel.textContent = "Endereço HTTPS da imagem";

        const urlInput = document.createElement("input");
        urlInput.type = "url";
        urlInput.placeholder = "https://...";
        urlInput.dataset.field = key;
        urlInput.value = content[key] || "";

        const fileLabel = document.createElement("label");
        fileLabel.textContent = "Selecionar imagem do computador";

        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/jpeg,image/png,image/webp";

        const help = document.createElement("p");
        help.className = "muted";
        help.textContent =
          "A seleção mostra uma prévia. O envio ao servidor " +
          "será habilitado na atualização da API.";

        function updatePreview(source) {
          if (/^https:\/\/\S+$/i.test(source)) {
            image.src = source;
            image.hidden = false;
            placeholder.hidden = true;
          } else {
            image.removeAttribute("src");
            image.hidden = true;
            placeholder.hidden = false;
          }
        }

        image.onerror = () => {
          image.hidden = true;
          placeholder.hidden = false;
        };

        urlInput.addEventListener("input", () => {
          content[key] = urlInput.value;
          updatePreview(urlInput.value);
        });

        fileInput.addEventListener("change", () => {
          const file = fileInput.files?.[0];
          if (!file) return;

          if (
            !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
            file.size > 2500000
          ) {
            message(
              "Selecione JPG, PNG ou WebP de até 2,5 MB.",
              "error"
            );
            fileInput.value = "";
            return;
          }

          const reader = new FileReader();

          reader.onload = () => {
            image.src = String(reader.result);
            image.hidden = false;
            placeholder.hidden = true;
          };

          reader.readAsDataURL(file);

          message(
            "Prévia carregada. O arquivo ainda não foi enviado ao servidor."
          );
        });

        updatePreview(urlInput.value);

        visual.append(image, placeholder);
        controls.append(
          heading,
          description,
          urlLabel,
          urlInput,
          fileLabel,
          fileInput,
          help
        );

        wrapper.append(visual, controls);
        return wrapper;
      }

      const fieldLabel = document.createElement("label");
      fieldLabel.textContent = label;

      const input = type === "textarea"
        ? document.createElement("textarea")
        : document.createElement("input");

      if (type !== "textarea") {
        input.type = "text";
      }

      input.dataset.field = key;
      input.value = content[key] || "";

      input.addEventListener("input", () => {
        content[key] = input.value;
      });

      wrapper.append(fieldLabel, input);
      return wrapper;
    }

    function renderTabs() {
      const nav = $("page-tabs");
      nav.replaceChildren();

      for (const page of PAGES) {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          "page-tab" + (page.id === activePage ? " active" : "");
        button.textContent = page.title;

        button.onclick = () => {
          rememberInputs();
          activePage = page.id;
          render();
        };

        nav.append(button);
      }
    }

    function render() {
      renderTabs();

      const page = PAGES.find(p => p.id === activePage);
      const heading = $("page-heading");

      heading.replaceChildren();

      const title = document.createElement("h2");
      title.textContent = page.title;

      const description = document.createElement("p");
      description.textContent = page.description;

      heading.append(title, description);

      const container = $("page-fields");
      container.replaceChildren();

      for (const section of page.sections) {
        const panel = document.createElement("section");
        panel.className = "panel";

        const sectionTitle = document.createElement("h2");
        sectionTitle.textContent = section.title;
        panel.append(sectionTitle);

        if (section.description) {
          const detail = document.createElement("p");
          detail.className = "section-description";
          detail.textContent = section.description;
          panel.append(detail);
        }

        for (const [key, label, type] of section.fields) {
          panel.append(createField(key, label, type));
        }

        container.append(panel);
      }

      if (activePage === "inicio") {
        const general = document.createElement("section");
        general.className = "panel";

        const heading = document.createElement("h2");
        heading.textContent = "03 · Contato e SEO geral";
        general.append(heading);

        for (const [key, label, type] of GENERAL_FIELDS) {
          general.append(createField(key, label, type));
        }

        container.append(general);
      }
    }

    function setBusy(value) {
      busy = value;
      $("save").disabled = value;
      $("reload").disabled = value;
    }

    async function load() {
      setBusy(true);
      message("Carregando informações do site...");

      try {
        const data = await api(
          "/api/admin-gerenciar?action=site_conteudo"
        );

        if (!data.ok || !data.conteudo) {
          throw Error("O servidor não retornou os dados.");
        }

        content = { ...data.conteudo };
        lastSaved = JSON.stringify(snapshot());

        render();
        $("editor").hidden = false;

        message("Dados carregados. Escolha a página para editar.");
      } catch (error) {
        message(
          "Não foi possível carregar: " + error.message,
          "error"
        );
      } finally {
        setBusy(false);
      }
    }

    $("site-form").addEventListener("submit", async event => {
      event.preventDefault();

      if (busy) return;

      rememberInputs();

      const dataToSave = snapshot();

      if (
        dataToSave.whatsapp &&
        !/^\d{10,15}$/.test(dataToSave.whatsapp)
      ) {
        message(
          "WhatsApp: informe de 10 a 15 números.",
          "error"
        );
        return;
      }

      for (const [key, value] of Object.entries(dataToSave)) {
        if (
          key.endsWith("_imagem") &&
          value &&
          !/^https:\/\/\S+$/i.test(value)
        ) {
          message(
            "Imagem inválida: " + key + ". Use HTTPS.",
            "error"
          );
          return;
        }
      }

      setBusy(true);
      message("Salvando alterações...");

      try {
        /*
          Enquanto a API não for atualizada, salvamos
          somente os campos que ela já reconhece.

          Isso evita perder campos novos e preserva
          o funcionamento atual.
        */

        const legacyContent = {};

        for (const key of LEGACY_FIELDS) {
          legacyContent[key] = dataToSave[key];
        }

        const result = await api("/api/admin-gerenciar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "site_conteudo",
            conteudo: legacyContent
          })
        });

        if (!result.ok) {
          throw Error("O servidor não confirmou a gravação.");
        }

        lastSaved = JSON.stringify(snapshot());

        message(
          "Campos atuais salvos no Supabase. " +
          "Os novos campos das outras páginas ainda " +
          "dependem da atualização da API.",
          "success"
        );
      } catch (error) {
        message(
          "Não foi possível salvar: " + error.message,
          "error"
        );
      } finally {
        setBusy(false);
      }
    });

    $("reload").addEventListener("click", () => {
      rememberInputs();

      if (
        JSON.stringify(snapshot()) !== lastSaved &&
        !confirm("Descartar alterações não salvas?")
      ) {
        return;
      }

      load();
    });

    window.addEventListener("beforeunload", event => {
      rememberInputs();

      if (
        lastSaved !== "" &&
        JSON.stringify(snapshot()) !== lastSaved
      ) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    (async () => {
      try {
        const session = await api("/api/admin-session");

        if (session.autenticado !== true) {
          throw Error("Sessão não autorizada.");
        }

        await load();
      } catch (error) {
        message(
          "Acesso restrito. Entre no painel ADM. " +
          error.message,
          "error"
        );
      }
    })();
  </script>

</body>
</html>
