
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gerenciar Site | Mimbox ADM</title>

<style>
:root {
  --yellow: #F8D43A;
  --red: #E74732;
  --blue: #2355AC;
  --cream: #F5EBD5;
  --ink: #211B1B;
  --white: #FFFDF8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Arial, sans-serif;
}
header {
  background: var(--ink);
  color: white;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  font-size: 30px;
  font-weight: 900;
  color: var(--yellow);
}
header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}
main {
  max-width: 1150px;
  margin: 30px auto;
  padding: 0 18px 60px;
}
h1 { margin-bottom: 8px; }
.intro {
  color: #595148;
  line-height: 1.5;
}
#status {
  padding: 14px;
  background: white;
  border-left: 5px solid var(--blue);
  border-radius: 5px;
  margin: 20px 0;
  white-space: pre-wrap;
}
#status.error { border-color: var(--red); }
#status.success { border-color: #27824C; }
[hidden] { display: none !important; }
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
}
.tab {
  background: white;
  border: 2px solid var(--ink);
  padding: 12px 16px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}
.tab.active {
  background: var(--blue);
  color: white;
}
.page-title {
  background: var(--yellow);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
.page-title h2 { margin: 0 0 6px; }
.page-title p { margin: 0; }
.panel {
  background: var(--white);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 4px 4px 0 var(--ink);
}
.panel h3 { margin-top: 0; }
.field { margin-bottom: 20px; }
label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}
input, textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid #C3BAAD;
  border-radius: 8px;
  background: white;
  font: inherit;
}
textarea {
  min-height: 110px;
  resize: vertical;
}
.image-field {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 18px;
  padding: 15px;
  border: 2px dashed #C8C0B5;
  border-radius: 10px;
  background: #FAF7EF;
}
.image-preview {
  width: 180px;
  height: 160px;
  object-fit: contain;
  border-radius: 8px;
  background: #EAE5DB;
}
.image-placeholder {
  width: 180px;
  height: 160px;
  background: #EAE5DB;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: #746A60;
  text-align: center;
  padding: 12px;
}
.help {
  font-size: 13px;
  color: #655B51;
  line-height: 1.5;
}
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px;
}
button.action {
  border: 2px solid var(--ink);
  background: var(--yellow);
  padding: 14px 20px;
  border-radius: 9px;
  font-weight: 800;
  cursor: pointer;
}
button.secondary { background: white; }
button:disabled {
  opacity: .55;
  cursor: wait;
}
@media(max-width:650px) {
  .image-field { grid-template-columns: 1fr; }
  .tab { flex: 1 1 140px; }
}
</style>
</head>

<body>
<header>
  <div class="brand">mimbox.</div>
  <a href="/admin.html">← Voltar ao ADM</a>
</header>

<main>
  <h1>Gerenciar Site</h1>
  <p class="intro">
    Escolha a página e edite suas imagens, textos e botões.
    As alterações são salvas no Supabase.
  </p>

  <div id="status" role="status" aria-live="polite">
    Verificando acesso...
  </div>

  <div id="editor" hidden>
    <nav class="tabs" id="tabs"></nav>

    <div class="page-title" id="page-title"></div>

    <form id="site-form">
      <div id="fields"></div>

      <div class="actions">
        <button class="action" id="save" type="submit">
          Salvar alterações
        </button>
        <button class="action secondary" id="reload" type="button">
          Recarregar
        </button>
      </div>
    </form>
  </div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

/*
  Tipos de campos:
  text  = texto curto
  long  = texto longo
  image = endereço de imagem HTTPS
*/

const PAGES = [
  {
    id: "inicio",
    name: "Início",
    description: "Banner e imagens da página inicial.",
    sections: [
      {
        name: "Banner principal",
        fields: [
          ["hero_titulo", "Título principal", "text"],
          ["hero_subtitulo", "Subtítulo", "long"],
          ["hero_imagem", "Imagem principal", "image"],
          ["hero_botao_texto", "Texto do botão", "text"],
          ["hero_botao_link", "Link do botão", "text"]
        ]
      },
      {
        name: "Cards da página inicial",
        fields: [
          ["inicio_personalizados_imagem", "Card Personalizados", "image"],
          ["inicio_loja_imagem", "Card Loja Mimbox", "image"],
          ["inicio_negocios_imagem", "Card Para Negócios", "image"]
        ]
      },
      {
        name: "Contato e SEO",
        fields: [
          ["seo_titulo", "Título SEO", "text"],
          ["seo_descricao", "Descrição SEO", "long"],
          ["whatsapp", "WhatsApp com DDI e DDD", "text"],
          ["instagram", "Link do Instagram", "text"],
          ["aviso", "Aviso da loja", "long"]
        ]
      }
    ]
  },
  {
    id: "personalizados",
    name: "Personalizados",
    description: "Imagens e textos da página de personalizados.",
    sections: [
      {
        name: "Banner de Personalizados",
        fields: [
          ["personalizados_titulo", "Título", "text"],
          ["personalizados_subtitulo", "Descrição", "long"],
          ["personalizados_banner_imagem", "Imagem principal", "image"]
        ]
      },
      {
        name: "Categorias",
        fields: [
          ["personalizados_copos_imagem", "Foto dos copos", "image"],
          ["personalizados_pratos_imagem", "Foto dos pratos", "image"],
          ["personalizados_brindes_imagem", "Foto dos brindes", "image"]
        ]
      }
    ]
  },
  {
    id: "loja",
    name: "Loja Mimbox",
    description: "Banner e imagens editoriais da loja.",
    sections: [
      {
        name: "Banner da Loja",
        fields: [
          ["loja_titulo", "Título", "text"],
          ["loja_subtitulo", "Descrição", "long"],
          ["loja_banner_imagem", "Imagem principal", "image"],
          ["loja_botao_texto", "Texto do botão", "text"],
          ["loja_botao_link", "Link do botão", "text"]
        ]
      },
      {
        name: "Destaques",
        fields: [
          ["loja_colecoes_imagem", "Imagem das coleções", "image"],
          ["loja_destaque_imagem", "Imagem de destaque", "image"]
        ]
      }
    ]
  },
  {
    id: "negocios",
    name: "Para Negócios",
    description: "Conteúdo da página corporativa.",
    sections: [
      {
        name: "Banner Corporativo",
        fields: [
          ["negocios_titulo", "Título", "text"],
          ["negocios_subtitulo", "Descrição", "long"],
          ["negocios_banner_imagem", "Imagem principal", "image"]
        ]
      },
      {
        name: "Serviços",
        fields: [
          ["negocios_brindes_imagem", "Foto dos brindes", "image"],
          ["negocios_personalizados_imagem", "Foto dos personalizados", "image"],
          ["negocios_botao_texto", "Texto do botão", "text"],
          ["negocios_botao_link", "Link do botão", "text"]
        ]
      }
    ]
  },
  {
    id: "sobre",
    name: "Sobre",
    description: "História e fotografias da Mimbox.",
    sections: [
      {
        name: "Nossa História",
        fields: [
          ["sobre_titulo", "Título", "text"],
          ["sobre_texto", "História da Mimbox", "long"],
          ["sobre_banner_imagem", "Imagem principal", "image"]
        ]
      },
      {
        name: "Fundadoras",
        fields: [
          ["sobre_ana_imagem", "Foto da Ana", "image"],
          ["sobre_rafa_imagem", "Foto da Rafa", "image"]
        ]
      }
    ]
  },
  {
    id: "blog",
    name: "Blog",
    description: "Apresentação do Blog Mimbox.",
    sections: [
      {
        name: "Banner do Blog",
        fields: [
          ["blog_titulo", "Título", "text"],
          ["blog_subtitulo", "Descrição", "long"],
          ["blog_banner_imagem", "Imagem principal", "image"]
        ]
      }
    ]
  }
];

let content = {};
let lastSaved = "";
let activePage = "inicio";
let busy = false;

function message(text, type = "") {
  $("status").textContent = text;
  $("status").className = type;
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    cache: "no-store",
    ...options
  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw Error("Resposta inválida do servidor.");
  }

  if (!response.ok) {
    throw Error(
      data.erro ||
      data.error ||
      "Erro HTTP " + response.status
    );
  }

  return data;
}

function allKeys() {
  const keys = new Set();

  for (const page of PAGES) {
    for (const section of page.sections) {
      for (const [key] of section.fields) {
        keys.add(key);
      }
    }
  }

  return [...keys];
}

function snapshot() {
  const result = {};

  for (const key of allKeys()) {
    result[key] = String(content[key] ?? "").trim();
  }

  return result;
}

function rememberInputs() {
  document.querySelectorAll("[data-field]").forEach(input => {
    content[input.dataset.field] = input.value;
  });
}

function makeTextField(key, label, type) {
  const wrapper = document.createElement("div");
  wrapper.className = "field";

  const fieldLabel = document.createElement("label");
  fieldLabel.textContent = label;
  fieldLabel.htmlFor = "field-" + key;

  const input = type === "long"
    ? document.createElement("textarea")
    : document.createElement("input");

  if (type !== "long") {
    input.type = "text";
  }

  input.id = "field-" + key;
  input.dataset.field = key;
  input.value = content[key] || "";

  input.addEventListener("input", () => {
    content[key] = input.value;
  });

  wrapper.append(fieldLabel, input);
  return wrapper;
}

function makeImageField(key, label) {
  const wrapper = document.createElement("div");
  wrapper.className = "field image-field";

  const visual = document.createElement("div");

  const image = document.createElement("img");
  image.className = "image-preview";
  image.alt = "Prévia de " + label;

  const placeholder = document.createElement("div");
  placeholder.className = "image-placeholder";
  placeholder.textContent = "Sem imagem cadastrada";

  const controls = document.createElement("div");

  const heading = document.createElement("label");
  heading.textContent = label;
  heading.htmlFor = "field-" + key;

  const urlInput = document.createElement("input");
  urlInput.type = "url";
  urlInput.id = "field-" + key;
  urlInput.placeholder = "https://...";
  urlInput.dataset.field = key;
  urlInput.value = content[key] || "";

  const help = document.createElement("p");
  help.className = "help";
  help.textContent =
    "Cole o endereço HTTPS de uma imagem já hospedada. " +
    "O upload direto do computador ainda não está disponível.";

  function updatePreview(url) {
    if (/^https:\/\/\S+$/i.test(url)) {
      image.src = url;
      image.hidden = false;
      placeholder.hidden = true;
    } else {
      image.hidden = true;
      image.removeAttribute("src");
      placeholder.hidden = false;
    }
  }

  image.onerror = () => {
    image.hidden = true;
    placeholder.hidden = false;
  };

  urlInput.addEventListener("input", () => {
    content[key] = urlInput.value;
    updatePreview(urlInput.value.trim());
  });

  updatePreview(urlInput.value.trim());

  visual.append(image, placeholder);
  controls.append(heading, urlInput, help);
  wrapper.append(visual, controls);

  return wrapper;
}

function renderTabs() {
  const tabs = $("tabs");
  tabs.replaceChildren();

  for (const page of PAGES) {
    const button = document.createElement("button");
    button.type = "button";
    button.className =
      "tab" + (page.id === activePage ? " active" : "");
    button.textContent = page.name;
    button.setAttribute("aria-pressed", String(page.id === activePage));

    button.addEventListener("click", () => {
      rememberInputs();
      activePage = page.id;
      render();
    });

    tabs.append(button);
  }
}

function render() {
  renderTabs();

  const page = PAGES.find(
    item => item.id === activePage
  );

  const heading = $("page-title");
  heading.replaceChildren();

  const title = document.createElement("h2");
  title.textContent = page.name;

  const description = document.createElement("p");
  description.textContent = page.description;

  heading.append(title, description);

  const container = $("fields");
  container.replaceChildren();

  for (const section of page.sections) {
    const panel = document.createElement("section");
    panel.className = "panel";

    const sectionTitle = document.createElement("h3");
    sectionTitle.textContent = section.name;
    panel.append(sectionTitle);

    for (const [key, label, type] of section.fields) {
      panel.append(
        type === "image"
          ? makeImageField(key, label)
          : makeTextField(key, label, type)
      );
    }

    container.append(panel);
  }
}

function setBusy(value) {
  busy = value;
  $("save").disabled = value;
  $("reload").disabled = value;
}

async function load() {
  setBusy(true);
  message("Carregando informações do site...");

  try {
    const data = await api(
      "/api/admin-gerenciar?action=site_conteudo"
    );

    if (!data.ok || !data.conteudo) {
      throw Error("Conteúdo não encontrado.");
    }

    content = { ...data.conteudo };
    lastSaved = JSON.stringify(snapshot());

    render();
    $("editor").hidden = false;

    message("Dados carregados. Você já pode editar. Imagens devem ter uma URL HTTPS pública.");
  } catch (error) {
    message(
      "Erro ao carregar: " + error.message,
      "error"
    );
  } finally {
    setBusy(false);
  }
}

function validate(data) {
  if (
    data.whatsapp &&
    !/^\d{10,15}$/.test(data.whatsapp)
  ) {
    throw Error(
      "WhatsApp: informe de 10 a 15 números."
    );
  }

  if (
    data.instagram &&
    !/^https:\/\/\S+$/i.test(data.instagram)
  ) {
    throw Error(
      "Instagram: informe um endereço HTTPS."
    );
  }

  for (const [key, value] of Object.entries(data)) {
    if (
      key.endsWith("_imagem") &&
      value &&
      !/^https:\/\/\S+$/i.test(value)
    ) {
      throw Error(
        "Imagem inválida: " + key
      );
    }
  }
}

$("site-form").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  rememberInputs();

  const dataToSave = snapshot();

  try {
    validate(dataToSave);
  } catch (error) {
    message(error.message, "error");
    return;
  }

  setBusy(true);
  message("Salvando alterações no Supabase...");

  try {
    const result = await api("/api/admin-gerenciar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "site_conteudo",
        conteudo: dataToSave
      })
    });

    if (!result.ok) {
      throw Error(
        "O servidor não confirmou o salvamento."
      );
    }

    if (!result.conteudo || typeof result.conteudo !== "object") {
      throw Error("O servidor não devolveu o conteúdo salvo.");
    }

    content = { ...result.conteudo };
    lastSaved = JSON.stringify(snapshot());

    render();

    message(
      "Alterações salvas no Supabase. " +
      "As páginas públicas precisam estar integradas " +
      "para exibir os novos conteúdos.",
      "success"
    );
  } catch (error) {
    message(
      "Erro ao salvar: " + error.message,
      "error"
    );
  } finally {
    setBusy(false);
  }
});

$("reload").addEventListener("click", () => {
  rememberInputs();

  if (
    JSON.stringify(snapshot()) !== lastSaved &&
    !confirm("Descartar alterações não salvas?")
  ) {
    return;
  }

  load();
});

window.addEventListener("beforeunload", event => {
  rememberInputs();

  if (
    lastSaved &&
    JSON.stringify(snapshot()) !== lastSaved
  ) {
    event.preventDefault();
    event.returnValue = "";
  }
});

(async () => {
  try {
    const session = await api("/api/admin-session");

    if (session.autenticado !== true) {
      throw Error("Sessão não autorizada.");
    }

    await load();
  } catch (error) {
    message(
      "Acesso restrito. Entre no painel administrativo. " +
      error.message,
      "error"
    );
  }
})();
</script>
</body>
</html>
