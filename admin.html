
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimbox ADM</title>
<style>
:root{
  --amarelo:#f8d749;
  --azul:#2456a6;
  --vermelho:#e74739;
  --creme:#f5eedf;
  --preto:#181818;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--creme);
  color:var(--preto);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
input,select,textarea{
  display:block;
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:2px solid #222;
  border-radius:8px;
  background:white;
}
input[type=checkbox]{
  display:inline-block;
  width:auto;
  margin:0 8px 0 0;
}
label{font-weight:700;font-size:14px}
textarea{resize:vertical}
h1,h2,h3{line-height:1.2}
p{line-height:1.5}
.hidden{display:none!important}
.btn{
  background:var(--amarelo);
  border:2px solid var(--preto);
  border-radius:9px;
  padding:11px 16px;
  font-weight:800;
  margin:5px 5px 5px 0;
}
.btn.blue{background:var(--azul);color:white}
.btn.white{background:white}
.btn:disabled{opacity:.55}
.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}
.login-box{
  background:#fffdf6;
  border:3px solid var(--preto);
  border-radius:18px;
  box-shadow:7px 7px 0 var(--preto);
  padding:30px;
  width:100%;
  max-width:420px;
}
.logo{
  font-size:34px;
  font-weight:900;
  color:var(--vermelho);
  letter-spacing:-2px;
}
.layout{
  display:grid;
  grid-template-columns:235px minmax(0,1fr);
  min-height:100vh;
}
aside{
  background:var(--preto);
  color:white;
  padding:22px 14px;
}
aside .logo{color:var(--amarelo)}
nav{display:grid;gap:5px;margin-top:25px}
nav button{
  text-align:left;
  color:white;
  background:transparent;
  border:0;
  border-radius:8px;
  padding:13px;
  font-weight:700;
}
nav button:hover,nav button.active{background:var(--azul)}
main{padding:25px;min-width:0}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}
.card{
  background:#fffdf7;
  border:2px solid var(--preto);
  border-radius:14px;
  padding:20px;
  margin:18px 0;
  box-shadow:4px 4px 0 var(--preto);
  overflow-wrap:anywhere;
}
.card h2{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.metric{font-size:29px;font-weight:900}
.item{
  border-top:1px solid #ddd;
  padding:17px 0;
}
.notice{
  padding:12px;
  border-left:5px solid var(--azul);
  background:white;
  margin:15px 0;
  overflow-wrap:anywhere;
}
.error{border-left-color:var(--vermelho)}
.muted{color:#666;font-size:13px}
.row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
}
@media(max-width:800px){
  .layout{display:block}
  aside{padding:15px}
  nav{display:flex;overflow-x:auto;margin-top:12px}
  nav button{white-space:nowrap}
  main{padding:15px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="loading" class="login">
  Verificando sessão...
</section>

<section id="login-screen" class="login hidden">
  <div class="login-box">
    <div class="logo">mimbox.</div>
    <h1>Painel administrativo</h1>
    <form id="login-form">
      <label>E-mail</label>
      <input id="login-email" type="email" required
        autocomplete="username">

      <label>Senha</label>
      <input id="login-password" type="password" required
        autocomplete="current-password">

      <button class="btn" id="login-button"
        type="submit">Entrar</button>
    </form>
    <p id="login-message"></p>
  </div>
</section>

<div id="app" class="layout hidden">
  <aside>
    <div class="logo">mimbox.</div>
    <p>Central administrativa</p>
    <nav id="navigation">
      <button data-page="dashboard">📊 Dashboard</button>
      <button data-page="pedidos">📦 Pedidos</button>
      <button data-page="novo">➕ Novo pedido</button>
      <button data-page="produtos">🛍️ Produtos</button>
      <button data-page="clientes">👥 Clientes</button>
      <button data-page="retirada">📍 Retirada</button>
      <button data-page="loja">⚙️ Configurações</button>
    </nav>
  </aside>

  <main>
    <div class="header">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <p class="muted">Mimbox ADM</p>
      </div>
      <button id="logout" class="btn white">Sair</button>
    </div>

    <div id="message" role="status"></div>
    <div id="content"></div>
  </main>
</div>

<script>
"use strict";

const el = id => document.getElementById(id);

const state = {
  pedidos: [],
  produtos: [],
  clientes: [],
  config: {},
  gestaoDisponivel: false
};

const pages = {
  dashboard:"Dashboard",
  pedidos:"Pedidos",
  novo:"Novo pedido",
  produtos:"Produtos",
  clientes:"Clientes",
  retirada:"Retirada",
  loja:"Configurações"
};

const deliveryStatuses = [
  ["aguardando","Aguardando"],
  ["em_preparacao","Em preparação"],
  ["pronto_retirada","Pronto para retirada"],
  ["enviado","Enviado"],
  ["entregue","Entregue"],
  ["cancelado","Cancelado"]
];

function show(id) {
  for(const key of ["loading","login-screen","app"]){
    el(key).classList.toggle("hidden",key!==id);
  }
}

function message(text,isError=false){
  const area=el("message");
  area.replaceChildren();
  if(!text)return;
  const box=document.createElement("div");
  box.className="notice"+(isError?" error":"");
  box.textContent=text;
  area.append(box);
}

function node(tag,text,cls){
  const n=document.createElement(tag);
  if(text!==undefined)n.textContent=String(text??"");
  if(cls)n.className=cls;
  return n;
}

function card(title){
  const c=node("section",undefined,"card");
  c.append(node("h2",title));
  return c;
}

function line(title,value){
  const p=node("p");
  const b=node("strong",title+": ");
  p.append(b,document.createTextNode(
    String(value??"Não informado")
  ));
  return p;
}

function money(value){
  return Number(value||0).toLocaleString(
    "pt-BR",{style:"currency",currency:"BRL"}
  );
}

function field(title,value="",type="text"){
  const wrapper=node("div");
  const label=node("label",title);
  const input=type==="textarea"
    ?document.createElement("textarea")
    :document.createElement("input");
  if(type!=="textarea")input.type=type;
  input.value=value??"";
  if(type==="number"){
    input.min="0";
    input.step="0.01";
  }
  wrapper.append(label,input);
  return {wrapper,input};
}

function button(title,callback){
  const b=node("button",title,"btn");
  b.type="button";
  b.onclick=async()=>{
    b.disabled=true;
    try{await callback();}
    catch(e){message(e.message,true);}
    finally{b.disabled=false;}
  };
  return b;
}

async function request(url,options={}){
  const response=await fetch(url,{
    credentials:"same-origin",
    cache:"no-store",
    ...options
  });

  let data;
  try{data=await response.json();}
  catch{throw Error("Resposta inválida da API");}

  if(!response.ok){
    throw Error(
      data.erro||data.error||"Erro HTTP "+response.status
    );
  }
  return data;
}

async function manage(action,data){
  if(data===undefined){
    return request(
      "/api/admin-gerenciar?action="+
      encodeURIComponent(action)
    );
  }
  return request("/api/admin-gerenciar",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,...data})
  });
}

async function checkSession(){
  try{
    const data=await request("/api/admin-session");
    if(data.autenticado===true){
      show("app");
      openPage("dashboard");
    }else{
      show("login-screen");
    }
  }catch{
    show("login-screen");
  }
}

el("login-form").onsubmit=async event=>{
  event.preventDefault();
  const b=el("login-button");
  b.disabled=true;
  el("login-message").textContent="Verificando...";

  try{
    await request("/api/admin-login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email:el("login-email").value.trim(),
        senha:el("login-password").value
      })
    });
    el("login-password").value="";
    await checkSession();
  }catch(e){
    el("login-message").textContent=e.message;
  }finally{
    b.disabled=false;
  }
};

el("logout").onclick=async()=>{
  try{
    await request("/api/admin-logout",{method:"POST"});
    show("login-screen");
  }catch(e){message(e.message,true);}
};

el("navigation").onclick=event=>{
  const b=event.target.closest("[data-page]");
  if(b)openPage(b.dataset.page);
};

async function loadOrders(){
  const data=await request("/api/admin-pedidos");
  state.pedidos=Array.isArray(data.pedidos)
    ?data.pedidos:[];
}

async function loadManagement(){
  try{
    const data=await manage("overview");
    state.gestaoDisponivel=true;

    if(Array.isArray(data.pedidos) &&
       data.pedidos.length>=state.pedidos.length){
      state.pedidos=data.pedidos;
    }

    state.produtos=Array.isArray(data.produtos)
      ?data.produtos:[];
    state.clientes=Array.isArray(data.clientes)
      ?data.clientes:[];
    state.config=data.config||{};
  }catch(e){
    state.gestaoDisponivel=false;
    throw e;
  }
}

async function openPage(name){
  if(!pages[name])return;

  el("page-title").textContent=pages[name];
  message("");

  document.querySelectorAll("[data-page]")
    .forEach(b=>b.classList.toggle(
      "active",b.dataset.page===name
    ));

  const area=el("content");
  area.replaceChildren(node("p","Carregando..."));

  let orderError=null;
  let managementError=null;

  if(name==="dashboard"||name==="pedidos"){
    try{await loadOrders();}
    catch(e){orderError=e;}
  }

  if(name!=="pedidos"){
    try{await loadManagement();}
    catch(e){managementError=e;}
  }

  // Se a API nova falhar, os pedidos continuam
  // sendo consultados pela API antiga.
  if(name==="pedidos"){
    try{await loadManagement();}
    catch(e){managementError=e;}
  }

  if(el("page-title").textContent!==pages[name])return;

  area.replaceChildren();

  if(orderError){
    message(
      "Não foi possível atualizar pedidos: "+
      orderError.message,true
    );
  }else if(managementError){
    message(
      "Gerenciamento avançado indisponível: "+
      managementError.message+
      ". As funções existentes continuam acessíveis.",
      true
    );
  }

  if(name==="dashboard")dashboard(area);
  if(name==="pedidos")orders(area);
  if(name==="novo")newOrder(area);
  if(name==="produtos")products(area);
  if(name==="clientes")customers(area);
  if(name==="retirada")pickup(area);
  if(name==="loja")settings(area);
}

function dashboard(area){
  const grid=node("div",undefined,"grid");
  const metrics=[
    ["📦 Pedidos",state.pedidos.length],
    ["⏳ Pagamentos pendentes",
      state.pedidos.filter(p=>
        p.status_pagamento==="pendente").length],
    ["📦 Em preparação",
      state.pedidos.filter(p=>
        p.status_entrega==="em_preparacao").length],
    ["🛍️ Produtos",state.produtos.length],
    ["👥 Clientes",state.clientes.length],
    ["📍 Retirada",
      state.config.retirada_ativa?"Ativada":"Desativada"]
  ];

  for(const [title,value] of metrics){
    const c=card(title);
    c.append(node("div",value,"metric"));
    grid.append(c);
  }
  area.append(grid);

  const c=card("Acompanhamento da loja");
  c.append(node("p",
    "O status de pagamento deve ser conferido "+
    "na InfinitePay. O painel não confirma "+
    "pagamentos automaticamente."
  ));
  c.append(button("Ver pedidos",()=>openPage("pedidos")));
  area.append(c);
}

function orders(area){
  const intro=card("📦 Pedidos cadastrados");
  intro.append(button(
    "Atualizar pedidos",()=>openPage("pedidos")
  ));
  area.append(intro);

  if(!state.pedidos.length){
    area.append(card("Nenhum pedido disponível"));
    return;
  }

  for(const p of state.pedidos){
    const c=card(
      "Pedido "+(p.numero_pedido||p.id)
    );

    const customer=Array.isArray(p.clientes)
      ?p.clientes[0]:p.clientes;

    c.append(
      line("Cliente",customer?.nome),
      line("WhatsApp",customer?.telefone),
      line("E-mail",customer?.email),
      line("Total",money(p.valor_total)),
      line("Pagamento",p.status_pagamento),
      line("Entrega",p.forma_entrega),
      line("Andamento",p.status_entrega)
    );

    if(Array.isArray(p.itens)){
      for(const item of p.itens){
        c.append(line(
          "Produto",
          (item.descricao||item.nome||
           item.description||"Item")+
          " — "+(item.quantidade||item.quantity||1)
        ));
      }
    }

    if(p.endereco_entrega){
      c.append(line(
        "Endereço",
        typeof p.endereco_entrega==="string"
          ?p.endereco_entrega
          :JSON.stringify(p.endereco_entrega)
      ));
    }

    if(state.gestaoDisponivel){
      const f=field("Alterar andamento");
      f.input.remove();

      const select=document.createElement("select");
      for(const [value,label] of deliveryStatuses){
        const option=node("option",label);
        option.value=value;
        option.selected=p.status_entrega===value;
        select.append(option);
      }
      f.wrapper.append(select);
      c.append(f.wrapper);

      c.append(button("Salvar andamento",async()=>{
        await manage("pedido_status",{
          id:p.id,
          status_entrega:select.value
        });
        await openPage("pedidos");
        message("Andamento atualizado.");
      }));

      const notes=field(
        "Observações internas",
        p.observacoes||"","textarea"
      );
      c.append(notes.wrapper);

      c.append(button("Salvar observação",async()=>{
        await manage("pedido_nota",{
          id:p.id,nota:notes.input.value
        });
        message("Observação salva.");
      }));
    }else{
      c.append(node("p",
        "Edição indisponível até a API de "+
        "gerenciamento responder corretamente.",
        "muted"
      ));
    }

    area.append(c);
  }
}

function newOrder(area){
  const c=card("➕ Cadastrar pedido manual");
  c.append(node("p",
    "Pedidos manuais começam com pagamento "+
    "pendente. Não representam pagamento confirmado."
  ));

  if(!state.gestaoDisponivel){
    c.append(node("p",
      "Cadastro temporariamente indisponível: "+
      "verifique a API admin-gerenciar."
    ));
    area.append(c);
    return;
  }

  const form=node("form");
  const inputs={
    nome:field("Nome do cliente"),
    email:field("E-mail","","email"),
    telefone:field("WhatsApp"),
    descricao:field("Produto ou coleção"),
    quantidade:field("Quantidade",1,"number"),
    valor:field("Valor total em R$",0,"number")
  };

  for(const [key,f] of Object.entries(inputs)){
    if(["nome","email","descricao","quantidade","valor"]
      .includes(key))f.input.required=true;
    form.append(f.wrapper);
  }

  const delivery=field("Forma de entrega");
  delivery.input.remove();

  const select=node("select");
  for(const [value,label] of [
    ["retirada","Retirada"],
    ["transportadora","Transportadora"]
  ]){
    const option=node("option",label);
    option.value=value;
    select.append(option);
  }
  delivery.wrapper.append(select);
  form.append(delivery.wrapper);

  const save=node("button","Cadastrar pedido","btn");
  save.type="submit";
  form.append(save);

  form.onsubmit=async event=>{
    event.preventDefault();
    save.disabled=true;
    try{
      await manage("pedido_manual",{
        cliente:{
          nome:inputs.nome.input.value,
          email:inputs.email.input.value,
          telefone:inputs.telefone.input.value
        },
        pedido:{
          descricao:inputs.descricao.input.value,
          quantidade:Number(inputs.quantidade.input.value),
          valor_total:Number(inputs.valor.input.value),
          forma_entrega:select.value
        }
      });
      await openPage("pedidos");
      message("Pedido cadastrado.");
    }catch(e){message(e.message,true);}
    finally{save.disabled=false;}
  };

  c.append(form);
  area.append(c);
}

function products(area){
  const c=card("🛍️ Produtos cadastrados");

  if(!state.gestaoDisponivel){
    c.append(node("p",
      "A edição precisa da API de gerenciamento. "+
      "Os produtos existentes não foram alterados."
    ));
    area.append(c);
    return;
  }

  if(!state.produtos.length){
    c.append(node("p","Nenhum produto encontrado."));
  }

  for(const p of state.produtos){
    const item=node("div",undefined,"item");
    item.append(node("h3",p.nome||"Produto"));

    const inputs={
      nome:field("Nome",p.nome),
      colecao:field("Coleção",p.colecao),
      preco:field("Preço",p.preco,"number"),
      descricao:field("Descrição",p.descricao,"textarea"),
      imagem_url:field("URL da imagem",p.imagem_url)
    };

    for(const f of Object.values(inputs)){
      item.append(f.wrapper);
    }

    const available=node("input");
    available.type="checkbox";
    available.checked=!!p.disponivel;

    const featured=node("input");
    featured.type="checkbox";
    featured.checked=!!p.destaque;

    const la=node("label");
    la.append(available," Disponível");

    const lf=node("label");
    lf.append(featured," Destaque");

    item.append(la,lf);

    item.append(button("Salvar produto",async()=>{
      await manage("produto",{
        produto:{
          id:p.id,
          nome:inputs.nome.input.value,
          colecao:inputs.colecao.input.value,
          preco:Number(inputs.preco.input.value),
          descricao:inputs.descricao.input.value,
          imagem_url:inputs.imagem_url.input.value,
          disponivel:available.checked,
          destaque:featured.checked
        }
      });
      message("Produto salvo.");
    }));

    c.append(item);
  }

  area.append(c);
}

function customers(area){
  const c=card("👥 Clientes");

  if(!state.gestaoDisponivel){
    c.append(node("p",
      "Consulta de clientes indisponível "+
      "até a conexão com a API ser corrigida."
    ));
  }else if(!state.clientes.length){
    c.append(node("p","Nenhum cliente cadastrado."));
  }else{
    for(const customer of state.clientes){
      const item=node("div",undefined,"item");
      item.append(
        node("h3",customer.nome||"Cliente"),
        line("E-mail",customer.email),
        line("WhatsApp",customer.telefone)
      );
      c.append(item);
    }
  }
  area.append(c);
}

function pickup(area){
  const c=card("📍 Retirada de pedidos");

  c.append(node("p",
    "Estas informações serão salvas no banco. "+
    "A opção de retirada só será controlada "+
    "automaticamente no checkout quando "+
    "a vitrine estiver conectada à configuração."
  ));

  if(!state.gestaoDisponivel){
    c.append(node("p",
      "Configurações indisponíveis: "+
      "verifique a API admin-gerenciar."
    ));
    area.append(c);
    return;
  }

  const active=node("input");
  active.type="checkbox";
  active.checked=!!state.config.retirada_ativa;

  const label=node("label");
  label.append(active," Permitir retirada");
  c.append(label);

  const local=field(
    "Local de retirada",
    state.config.retirada_local
  );
  const hours=field(
    "Horários",
    state.config.retirada_horarios,
    "textarea"
  );
  const instructions=field(
    "Instruções",
    state.config.retirada_instrucoes,
    "textarea"
  );

  c.append(
    local.wrapper,
    hours.wrapper,
    instructions.wrapper
  );

  c.append(button("Salvar retirada",async()=>{
    await saveConfig({
      retirada_ativa:active.checked,
      retirada_local:local.input.value,
      retirada_horarios:hours.input.value,
      retirada_instrucoes:instructions.input.value
    });
  }));

  area.append(c);
}

function settings(area){
  const c=card("⚙️ Informações da loja");

  if(!state.gestaoDisponivel){
    c.append(node("p",
      "A API de gerenciamento precisa "+
      "estar funcionando para salvar alterações."
    ));
    area.append(c);
    return;
  }

  const notice=field(
    "Aviso da loja",
    state.config.loja_aviso,
    "textarea"
  );
  const whatsapp=field(
    "WhatsApp",
    state.config.whatsapp
  );
  const instagram=field(
    "Instagram",
    state.config.instagram
  );

  c.append(
    notice.wrapper,
    whatsapp.wrapper,
    instagram.wrapper
  );

  c.append(button("Salvar informações",async()=>{
    await saveConfig({
      loja_aviso:notice.input.value,
      whatsapp:whatsapp.input.value,
      instagram:instagram.input.value
    });
  }));

  area.append(c);
}

async function saveConfig(changes){
  const config={...state.config,...changes};
  const result=await manage("config",{config});
  state.config=result.config||config;
  message("Configurações salvas.");
}

checkSession();
</script>
</body>
</html>
