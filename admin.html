
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel ADM | Mimbox</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5edda;
      font-family: Arial, sans-serif;
      color: #171717;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: #fffdf6;
      border: 3px solid #171717;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 8px 8px 0 #171717;
    }

    .marca {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #e33d32;
      margin-bottom: 6px;
    }

    h1 { font-size: 24px; margin: 0 0 8px; }

    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 2px solid #171717;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 2px solid #171717;
      border-radius: 8px;
      background: #f7d548;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .aviso {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      text-align: center;
      min-height: 36px;
    }

    .sucesso { color: #176b39; }
    .erro { color: #b42318; }
  </style>
</head>
<body>
  <main class="login">
    <div class="marca">mimbox.</div>
    <h1>Painel administrativo</h1>
    <p>Entre para gerenciar sua loja.</p>

    <form id="login">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
        placeholder="Seu e-mail"
      >

      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Sua senha"
      >

      <button id="entrar" type="submit">
        Entrar no painel
      </button>
    </form>

    <div class="aviso" id="aviso" role="status">
      Acesso exclusivo da administração Mimbox.
    </div>
  </main>

  <script>
    const formulario = document.getElementById("login");
    const aviso = document.getElementById("aviso");
    const botao = document.getElementById("entrar");

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      botao.disabled = true;
      botao.textContent = "Verificando...";
      aviso.className = "aviso";
      aviso.textContent = "Verificando seu acesso...";

      try {
        const resposta = await fetch("/api/admin-login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, senha })
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
          throw new Error(
            resultado.erro || "Não foi possível entrar."
          );
        }

        aviso.className = "aviso sucesso";
        aviso.textContent =
          "Login validado! A área administrativa ainda está em construção.";

        document.getElementById("senha").value = "";

      } catch (erro) {
        aviso.className = "aviso erro";
        aviso.textContent = erro.message;
      } finally {
        botao.disabled = false;
        botao.textContent = "Entrar no painel";
      }
    });
  </script>
</body>
</html>
