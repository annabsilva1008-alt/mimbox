
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel ADM | Mimbox</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --creme: #f5edda;
      --amarelo: #f7d548;
      --vermelho: #e33d32;
      --azul: #2455a4;
      --preto: #171717;
    }

    body {
      margin: 0;
      background: var(--creme);
      color: var(--preto);
      font-family: Arial, sans-serif;
    }

    button, input, textarea { font: inherit; }

    button { cursor: pointer; }

    .escondido { display: none !important; }

    .login-area {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fffdf6;
      border: 3px solid var(--preto);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 8px 8px 0 var(--preto);
    }

    .marca {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--vermelho);
    }

    h1 { font-size: 25px; }

    .subtitulo {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 20px 0 8px;
    }

    input:not([type="checkbox"]), textarea {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--preto);
      border-radius: 8px;
    }

    textarea { resize: vertical; }

    .linha-check { display: flex; align-items: center; gap: 9px; margin: 16px 0; }
    .linha-check input { width: auto; }
    .produto-item { border-top: 1px solid #ddd; padding: 12px 0; }
    .produto-item strong { display: block; }
    .produto-item small { color: #555; }

    .botao {
      background: var(--amarelo);
      border: 2px solid var(--preto);
      border-radius: 9px;
      padding: 13px 18px;
      font-weight: 800;
    }

    .botao:disabled {
      opacity: .6;
      cursor: wait;
    }

    .entrar {
      width: 100%;
      margin-top: 24px;
    }

    .aviso {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }

    .painel {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 245px 1fr;
    }

    aside {
      background: var(--preto);
      color: white;
      padding: 26px 18px;
    }

    aside .marca { color: var(--amarelo); }

    .menu {
      display: grid;
      gap: 7px;
      margin-top: 35px;
    }

    .menu button {
      background: transparent;
      color: white;
      border: 0;
      text-align: left;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
    }

    .menu button.ativo,
    .menu button:hover {
      background: var(--azul);
    }

    main.conteudo {
      padding: 32px;
      max-width: 1300px;
      width: 100%;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .topo h1 { margin: 0 0 8px; }

    .sair {
      background: white;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #fffdf6;
      border: 2px solid var(--preto);
      border-radius: 15px;
      padding: 22px;
      box-shadow: 4px 4px 0 var(--preto);
    }

    .card h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .card p {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    .etiqueta {
      display: inline-block;
      background: var(--amarelo);
      border: 1px solid var(--preto);
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: bold;
    }

    .destaque {
      border-top: 7px solid var(--vermelho);
    }

    .secao { margin-top: 25px; }

    .rodape {
      margin-top: 35px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 850px) {
      .painel {
        display: block;
      }

      aside { padding: 18px; }

      .menu {
        display: flex;
        overflow-x: auto;
        margin-top: 18px;
      }

      .menu button {
        white-space: nowrap;
      }

      main.conteudo { padding: 22px; }

      .grade { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <section id="carregando" class="login-area">
    <p>Verificando acesso ao Painel Mimbox...</p>
  </section>

  <section id="login-area" class="login-area escondido">
    <div class="login-card">
      <div class="marca">mimbox.</div>
      <h1>Painel administrativo</h1>
      <p class="subtitulo">
        Entre com seu acesso de administradora.
      </p>

      <form id="login">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="entrar" class="botao entrar" type="submit">
          Entrar no painel
        </button>
      </form>

      <p id="aviso" class="aviso" role="status"></p>
    </div>
  </section>

  <div id="painel" class="painel escondido">
    <aside>
      <div class="marca">mimbox.</div>
      <p>Painel administrativo</p>

      <nav class="menu" aria-label="Menu administrativo">
        <button class="ativo" data-pagina="dashboard">
          📊 Dashboard
        </button>
        <button data-pagina="editor">
          🎨 Editor do Site
        </button>
        <button data-pagina="produtos">
          🛍️ Produtos
        </button>
        <button data-pagina="pedidos">
          📦 Pedidos
        </button>
        <button data-pagina="clientes">
          👥 Clientes
        </button>
        <button data-pagina="clube">
          🎁 Clube Mimbox
        </button>
        <button data-pagina="estoque">
          📋 Estoque
        </button>
        <button data-pagina="envios">
          🚚 Envios
        </button>
      </nav>
    </aside>

    <main class="conteudo">
      <header class="topo">
        <div>
          <h1 id="titulo-pagina">Dashboard</h1>
          <span class="subtitulo">
            Central de controle da Mimbox
          </span>
        </div>

        <button id="sair" class="botao sair">
          Sair do painel
        </button>
      </header>

      <div id="conteudo-pagina"></div>

      <p class="rodape">
        Mimbox ADM — Estrutura inicial.
        Os recursos de edição e os dados reais serão
        conectados nas próximas etapas.
      </p>
    </main>
  </div>

  <script>
    const telas = {
      dashboard: {
        titulo: "Dashboard",
        html: `
          <div class="grade">
            <div class="card">
              <h2>💰 Faturamento</h2>
              <p>Meta mensal</p>
              <h1>R$ 8.500</h1>
              <span class="etiqueta">Meta cadastrada</span>
            </div>

            <div class="card">
              <h2>📦 Kits vendidos</h2>
              <p>Meta mensal</p>
              <h1>144 kits</h1>
              <span class="etiqueta">Meta cadastrada</span>
            </div>

            <div class="card">
              <h2>🎁 Clube Mimbox</h2>
              <p>
                Acompanhamento de assinaturas,
                caixas mensais e brindes.
              </p>
              <span class="etiqueta">Em construção</span>
            </div>
          </div>

          <div class="card secao destaque">
            <h2>Bem-vinda ao Painel Mimbox!</h2>
            <p>
              Esta é a primeira versão da central
              administrativa. As metas exibidas acima
              são referências, não resultados de vendas.
            </p>
          </div>
        `
      },

      editor: {
        titulo: "Editor do Site",
        html: `
          <div class="card destaque">
            <h2>🎨 Sua loja, do seu jeito</h2>
            <p>
              Aqui você poderá editar o site sem
              precisar acessar o GitHub.
            </p>
            <span class="etiqueta">Em construção</span>
          </div>

          <div class="grade secao">
            <div class="card">
              <h2>🖼️ Imagens e banners</h2>
              <p>Trocar fotos, banners e imagens.</p>
            </div>

            <div class="card">
              <h2>✏️ Textos e botões</h2>
              <p>Editar frases, títulos e chamadas.</p>
            </div>

            <div class="card">
              <h2>🧩 Seções do site</h2>
              <p>Organizar e personalizar a página.</p>
            </div>
          </div>
        `
      },

      produtos: {
        titulo: "Produtos",
        html: `
          <div class="card destaque">
            <h2>🛍️ Cadastrar produto</h2>
            <p>Cadastre produtos no Supabase. Eles ainda não aparecem automaticamente na loja.</p>
            <form id="form-produto">
              <label for="produto-nome">Nome do produto *</label>
              <input id="produto-nome" maxlength="150" required>
              <label for="produto-colecao">Coleção</label>
              <input id="produto-colecao" maxlength="100">
              <label for="produto-preco">Preço (R$) *</label>
              <input id="produto-preco" type="number" min="0" max="99999999.99" step="0.01" placeholder="Ex.: 59,90" required>
              <label for="produto-descricao">Descrição</label>
              <textarea id="produto-descricao" maxlength="2000" rows="4"></textarea>
              <label for="produto-imagem">Link HTTPS da imagem (opcional)</label>
              <input id="produto-imagem" type="url" placeholder="https://..." maxlength="2048">
              <label class="linha-check"><input id="produto-disponivel" type="checkbox" checked> Produto disponível</label>
              <label class="linha-check"><input id="produto-destaque" type="checkbox"> Produto em destaque</label>
              <button class="botao" type="submit" id="salvar-produto">Salvar produto</button>
              <p id="mensagem-produto" class="aviso" role="status"></p>
            </form>
          </div>
          <div class="card secao">
            <h2>Produtos cadastrados</h2>
            <p>Lista do banco de dados, ainda não conectada à vitrine da loja.</p>
            <div id="lista-produtos" aria-live="polite">Carregando produtos...</div>
          </div>
        `
      },

      pedidos: {
        titulo: "Pedidos",
        html: `
          <div class="card">
            <h2>📦 Gestão de pedidos</h2>
            <p>
              Vendas do site, Instagram, WhatsApp
              e pedidos cadastrados manualmente.
            </p>
            <span class="etiqueta">Em construção</span>
          </div>
        `
      },

      clientes: {
        titulo: "Clientes",
        html: `
          <div class="card">
            <h2>👥 Cadastro de clientes</h2>
            <p>
              Histórico de compras e informações
              dos clientes, com acesso protegido.
            </p>
            <span class="etiqueta">Em construção</span>
          </div>
        `
      },

      clube: {
        titulo: "Clube Mimbox",
        html: `
          <div class="card">
            <h2>🎁 Assinaturas</h2>
            <p>
              Planos de 3, 6 e 9 meses,
              caixas enviadas, coleções e brindes.
            </p>
            <span class="etiqueta">Em construção</span>
          </div>
        `
      },

      estoque: {
        titulo: "Estoque",
        html: `
          <div class="card">
            <h2>📋 Controle de estoque</h2>
            <p>
              Copos, adesivos, embalagens e
              materiais usados nos kits.
            </p>
            <span class="etiqueta">Em construção</span>
          </div>
        `
      },

      envios: {
        titulo: "Envios",
        html: `
          <div class="card">
            <h2>🚚 Calendário de despachos</h2>
            <p>
              Envios de terça a sexta-feira,
              exceto feriados. Sem envios na terça
              quando a segunda anterior for feriado.
            </p>
            <span class="etiqueta">Em construção</span>
          </div>
        `
      }
    };

    const carregando =
      document.getElementById("carregando");
    const loginArea =
      document.getElementById("login-area");
    const painel =
      document.getElementById("painel");
    const aviso =
      document.getElementById("aviso");

    function mostrarLogin() {
      carregando.classList.add("escondido");
      painel.classList.add("escondido");
      loginArea.classList.remove("escondido");
    }

    function mostrarPainel() {
      carregando.classList.add("escondido");
      loginArea.classList.add("escondido");
      painel.classList.remove("escondido");
      abrirPagina("dashboard");
    }

    function abrirPagina(nome) {
      const pagina = telas[nome];

      if (!pagina) return;

      document.getElementById(
        "titulo-pagina"
      ).textContent = pagina.titulo;

      document.getElementById(
        "conteudo-pagina"
      ).innerHTML = pagina.html;

      document.querySelectorAll(
        ".menu button"
      ).forEach(botao => {
        botao.classList.toggle(
          "ativo",
          botao.dataset.pagina === nome
        );
      });
      if (nome === "produtos") carregarProdutos();
    }

    async function carregarProdutos() {
      const lista = document.getElementById("lista-produtos");
      if (!lista) return;
      lista.textContent = "Carregando produtos...";
      try {
        const resposta = await fetch("/api/admin-produtos", {
          credentials: "same-origin", cache: "no-store"
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Falha ao consultar produtos");
        if (!document.getElementById("lista-produtos")) return;
        lista.replaceChildren();
        if (!Array.isArray(dados.produtos) || dados.produtos.length === 0) {
          lista.textContent = "Nenhum produto cadastrado ainda.";
          return;
        }
        for (const produto of dados.produtos) {
          const item = document.createElement("div");
          item.className = "produto-item";
          const nome = document.createElement("strong");
          nome.textContent = produto.nome || "Sem nome";
          const detalhes = document.createElement("small");
          const preco = Number(produto.preco);
          detalhes.textContent = `${produto.colecao || "Sem coleção"} · ${Number.isFinite(preco) ? preco.toLocaleString("pt-BR", {style:"currency",currency:"BRL"}) : "Preço indisponível"} · ${produto.disponivel ? "Disponível" : "Indisponível"}`;
          item.append(nome, detalhes);
          lista.append(item);
        }
      } catch (erro) {
        lista.textContent = erro.message || "Erro ao carregar produtos.";
      }
    }

    document.getElementById("conteudo-pagina")
      .addEventListener("submit", async event => {
        if (event.target.id !== "form-produto") return;
        event.preventDefault();
        const botao = document.getElementById("salvar-produto");
        const mensagem = document.getElementById("mensagem-produto");
        const form = event.target;
        const precoTexto = document.getElementById("produto-preco").value;
        const preco = Number(precoTexto);
        if (!precoTexto || !Number.isFinite(preco)) {
          mensagem.textContent = "Informe um preço válido.";
          return;
        }
        botao.disabled = true;
        mensagem.textContent = "Salvando produto...";
        try {
          const resposta = await fetch("/api/admin-salvar-produto", {
            method: "POST",
            credentials: "same-origin",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              nome: document.getElementById("produto-nome").value.trim(),
              colecao: document.getElementById("produto-colecao").value.trim(),
              preco,
              descricao: document.getElementById("produto-descricao").value.trim(),
              imagem_url: document.getElementById("produto-imagem").value.trim(),
              disponivel: document.getElementById("produto-disponivel").checked,
              destaque: document.getElementById("produto-destaque").checked
            })
          });
          const dados = await resposta.json();
          if (!resposta.ok) throw new Error(dados.erro || "Erro ao salvar produto");
          form.reset();
          mensagem.textContent = "Produto cadastrado com sucesso!";
          await carregarProdutos();
        } catch (erro) {
          mensagem.textContent = erro.message || "Não foi possível salvar.";
        } finally {
          if (document.getElementById("salvar-produto") === botao) botao.disabled = false;
        }
      });

    async function verificarSessao() {
      try {
        const resposta = await fetch(
          "/api/admin-session",
          {
            credentials: "same-origin",
            cache: "no-store"
          }
        );

        const dados = await resposta.json();

        if (resposta.ok && dados.autenticado === true) {
          mostrarPainel();
        } else {
          mostrarLogin();
        }
      } catch {
        mostrarLogin();
      }
    }

    document.querySelectorAll(
      ".menu button"
    ).forEach(botao => {
      botao.addEventListener("click", () => {
        abrirPagina(botao.dataset.pagina);
      });
    });

    document.getElementById("login")
      .addEventListener("submit", async event => {
        event.preventDefault();

        const botao =
          document.getElementById("entrar");

        botao.disabled = true;
        botao.textContent = "Verificando...";
        aviso.textContent = "Verificando seu acesso...";

        try {
          const resposta = await fetch(
            "/api/admin-login",
            {
              method: "POST",
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                email: document.getElementById(
                  "email"
                ).value.trim(),
                senha: document.getElementById(
                  "senha"
                ).value
              })
            }
          );

          const dados = await resposta.json();

          if (!resposta.ok) {
            throw new Error(
              dados.erro || "Falha no login"
            );
          }

          document.getElementById(
            "senha"
          ).value = "";

          await verificarSessao();

        } catch (erro) {
          aviso.textContent = erro.message;
        } finally {
          botao.disabled = false;
          botao.textContent = "Entrar no painel";
        }
      });

    document.getElementById("sair")
      .addEventListener("click", async () => {
        const botao = document.getElementById("sair");
        botao.disabled = true;

        try {
          const resposta = await fetch(
            "/api/admin-logout",
            {
              method: "POST",
              credentials: "same-origin"
            }
          );

          if (!resposta.ok) {
            throw new Error("Não foi possível sair.");
          }

          mostrarLogin();
          aviso.textContent = "Sessão encerrada.";

        } catch {
          alert(
            "Não foi possível encerrar a sessão. Tente novamente."
          );
        } finally {
          botao.disabled = false;
        }
      });

    verificarSessao();
  </script>
</body>
</html>
